<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Outer luxury hexagon / diamond crest border -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.4"/>
  <polygon points="60,12 102,36 102,84 60,108 18,36 18,84" stroke="#D4AF37" stroke-width="0.75" fill="none" opacity="0.2"/>
  
  <!-- Central Stylized AG Monogram with Gold Gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8820" />
    </linearGradient>
  </defs>

  <!-- Letter A -->
  <path d="M42,86 L60,34 L78,86 M48,70 L72,70" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Interlocking G Curve Arc -->
  <path d="M78,48 C72,38 52,38 42,50 C30,64 36,86 58,86 C74,86 82,74 82,64 L60,64" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  
  <!-- Crown Accent Star -->
  <polygon points="60,20 62,26 68,26 63,30 65,36 60,32 55,36 57,30 52,26 58,26" fill="url(#goldGrad)"/>
</svg>
