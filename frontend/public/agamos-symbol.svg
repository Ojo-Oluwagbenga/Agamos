<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich metallic 3D gold linear gradients -->
    <linearGradient id="brandGoldMetallic" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B88E28" />
      <stop offset="100%" stop-color="#805D12" />
    </linearGradient>
    <linearGradient id="brandGoldHighlight" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="40%" stop-color="#F2D179" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996E17" />
    </linearGradient>
    <linearGradient id="brandGoldShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#996E17" />
      <stop offset="100%" stop-color="#5E430B" />
    </linearGradient>
  </defs>

  <!-- AGAMOS Signature Ribbon-Flame Symbol -->
  <!-- Outer Main Swirl (The primary upward plume and lower loop) -->
  <path
    d="M 68 8 C 72 24, 76 44, 62 62 C 54 72, 42 78, 38 88 C 33 100, 39 114, 52 118 C 65 122, 79 116, 85 104 C 92 90, 84 76, 72 70 C 64 66, 56 67, 51 71 C 48 73, 46 76, 48 78 C 50 80, 54 78, 59 76 C 68 73, 76 77, 78 86 C 81 96, 73 108, 60 110 C 49 112, 41 104, 43 93 C 45 83, 54 76, 64 67 C 82 50, 83 26, 68 8 Z"
    fill="url(#brandGoldMetallic)"
  />

  <!-- Secondary Inner Feather / Flame Ridge Accent -->
  <path
    d="M 63 22 C 67 36, 66 50, 56 63 C 51 69, 45 74, 42 80 C 40 76, 43 70, 48 64 C 58 52, 60 38, 58 25 C 59 23, 62 21, 63 22 Z"
    fill="url(#brandGoldHighlight)"
  />

  <!-- Lower Ribbon Swirl Depth Shade -->
  <path
    d="M 52 118 C 39 114, 33 100, 38 88 C 40 83, 44 79, 49 76 C 47 79, 45 84, 44 89 C 42 101, 50 109, 61 108 C 57 114, 55 117, 52 118 Z"
    fill="url(#brandGoldShadow)"
    opacity="0.85"
  />

  <!-- Delicate Third Accent Quill -->
  <path
    d="M 72 35 C 75 45, 74 54, 68 63 C 67 61, 69 54, 71 47 C 73 40, 72 36, 72 35 Z"
    fill="url(#brandGoldHighlight)"
    opacity="0.9"
  />
</svg>
